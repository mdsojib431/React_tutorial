<!DOCTYPE html>
<html>
  <head>
    <title>Current Time</title>
  </head>
  <body>
    <div class="js-container"></div>
    <div class="js-container2"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const paragraph = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(paragraph);

      setInterval(() => {
        const paragraph = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;
        root.render(paragraph);
      }, 1000);

      // we can also use the setInterval function to update the time every second. 
        const container2 = document.querySelector('.js-container2');
        const root2 = ReactDOM.createRoot(container2);

        function updateTime() {
            const paragraph = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;
            root2.render(paragraph);
        }

        // 1. Call immediately so the page isn't blank for 1 second
        updateTime();

        // 2. Call every second
        setInterval(updateTime, 1000);
    </script>
  </body>
</html>
